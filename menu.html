<body data-page-title="Ross' Rotisserie - Menu" data-page-heading="Ross' Rotisserie Menu">
    <template id="page-content">
        <section class="card hero">
            <h2>Our Delicious Offerings</h2>
            <img src="https://picsum.photos/800/400?random=2" alt="Variety of rotisserie dishes" width="800" height="400" loading="lazy">
        </section>

        <section class="card full">
            <h3>Rotisserie Chicken</h3>
            <table>
                <caption>Chicken Options</caption>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Description</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Whole Chicken</td>
                        <td>Perfectly seasoned whole chicken</td>
                        <td>$12.99</td>
                    </tr>
                    <tr>
                        <td>Half Chicken</td>
                        <td>Half a rotisserie chicken</td>
                        <td>$7.99</td>
                    </tr>
                    <tr>
                        <td>Quarter Chicken</td>
                        <td>White or dark meat quarter</td>
                        <td>$4.99</td>
                    </tr>
                    <tr>
                        <td>Family Pack</td>
                        <td>2 whole chickens + 4 sides</td>
                        <td>$29.99</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div class="split">
            <section class="card">
                <h3>Side Dishes</h3>
                <img src="https://picsum.photos/600/300?random=3" alt="Delicious side dishes" width="600" height="300" loading="lazy">
                <dl>
                    <dt>Mashed Potatoes</dt>
                    <dd>Creamy, buttery mashed potatoes with gravy</dd>
                    
                    <dt>Coleslaw</dt>
                    <dd>Fresh cabbage slaw with our special dressing</dd>
                    
                    <dt>Corn on the Cob</dt>
                    <dd>Grilled corn with butter and herbs</dd>
                    
                    <dt>Green Beans</dt>
                    <dd>Seasoned green beans with almonds</dd>
                    
                    <dt>Mac and Cheese</dt>
                    <dd>Classic creamy macaroni and cheese</dd>
                    
                    <dt>Caesar Salad</dt>
                    <dd>Fresh romaine lettuce with Caesar dressing and croutons</dd>
                </dl>
            </section>

            <div class="stack">
                <section class="card">
                    <h3>Beverages</h3>
                    <ul>
                        <li>Soft Drinks (Coke, Pepsi, Sprite, etc.)</li>
                        <li>Iced Tea (Sweet or Unsweet)</li>
                        <li>Lemonade</li>
                        <li>Bottled Water</li>
                        <li>Coffee</li>
                    </ul>
                </section>

                <section class="card">
                    <h3>Desserts</h3>
                    <ol>
                        <li>Apple Pie</li>
                        <li>Chocolate Cake</li>
                        <li>Cookies (Chocolate Chip, Oatmeal Raisin)</li>
                        <li>Ice Cream (Vanilla, Chocolate, Strawberry)</li>
                    </ol>
                </section>
            </div>
        </div>

        <aside class="card">
            <h4>Special Offers</h4>
            <p><mark>Tuesday Special:</mark> Buy one whole chicken, get a free side dish!</p>
            <p><mark>Weekend Deal:</mark> Family pack only $24.99 (save $5!)</p>
        </aside>

        <section class="card full">
            <h3>Order Online</h3>
            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-field">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Order Details</legend>
                    <div class="form-field">
                        <label for="item">Select Item:</label>
                        <select id="item" name="item">
                            <option value="">Choose an option</option>
                            <option value="whole">Whole Chicken</option>
                            <option value="half">Half Chicken</option>
                            <option value="quarter">Quarter Chicken</option>
                            <option value="family">Family Pack</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
                    </div>

                    <div class="form-field">
                        <label for="pickup-time">Pickup Time:</label>
                        <input type="time" id="pickup-time" name="pickup-time">
                    </div>

                    <div class="form-field">
                        <label for="special-instructions">Special Instructions:</label>
                        <textarea id="special-instructions" name="special-instructions" rows="4" cols="50"></textarea>
                    </div>
                </fieldset>

                <fieldset class="choice-group">
                    <legend>Pickup or Delivery?</legend>
                    <div class="form-field">
                        <label>
                            <input type="radio" id="pickup" name="order-type" value="pickup" checked>
                            Pickup
                        </label>
                        <label>
                            <input type="radio" id="delivery" name="order-type" value="delivery">
                            Delivery
                        </label>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Subscribe to our newsletter for special offers
                    </label>
                </div>

                <button type="submit">Place Order</button>
                <button type="reset">Clear Form</button>
            </form>
        </section>
    </template>

    <script src="scripts/layout.js" type="module" defer></script>
</body>
