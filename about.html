<body data-page-title="Ross' Rotisserie - About Us" data-page-heading="About Ross' Rotisserie">
    <template id="page-content">
        <section class="card hero">
            <h2>Our Story</h2>
            <img src="https://picsum.photos/800/400?random=4" alt="Ross' Rotisserie storefront" width="800" height="400" loading="lazy">
            <p>Ross' Rotisserie was founded in <time datetime="2020">2020</time> by Ross Jackson, a passionate chef with a dream of bringing authentic, flavorful rotisserie chicken to the community. What started as a small family operation has grown into a beloved local favorite.</p>
            <p>Our commitment to quality has never wavered. We use only the <strong>freshest ingredients</strong> and <strong>time-tested cooking methods</strong> to ensure every chicken that leaves our kitchen is absolutely perfect.</p>
        </section>

        <article class="card team-grid full">
            <h3 class="team-title">Meet the Team</h3>
            <section class="team-member">
                <h4>Ross Jackson - Owner & Head Chef</h4>
                <img src="https://picsum.photos/300/300?random=5" alt="Ross Jackson" width="300" height="300" loading="lazy">
                <p>With over 20 years of culinary experience, Ross brings his expertise and passion to every dish. His secret spice blend is what makes our rotisserie chicken truly special.</p>
            </section>

            <section class="team-member">
                <h4>Maria Rodriguez - Kitchen Manager</h4>
                <img src="https://picsum.photos/300/300?random=6" alt="Maria Rodriguez" width="300" height="300" loading="lazy">
                <p>Maria ensures that every chicken is cooked to perfection. Her attention to detail and dedication to quality control makes her an invaluable member of our team.</p>
            </section>

            <section class="team-member">
                <h4>Tom Chen - Customer Service Lead</h4>
                <img src="https://picsum.photos/300/300?random=7" alt="Tom Chen" width="300" height="300" loading="lazy">
                <p>Tom's friendly smile and exceptional customer service keep our guests coming back. He's always ready to help you find the perfect meal.</p>
            </section>
        </article>

        <div class="pair">
            <section class="card">
                <h3>Our Values</h3>

                    <li><strong>Community:</strong> We're proud to be a part of this wonderful community and give back whenever we can</li>
                    <li><strong>Sustainability:</strong> We source our chickens from local, sustainable farms</li>
                    <li><strong>Excellence:</strong> We strive for excellence in everything we do, from cooking to customer service</li>
                    <li><strong>Family:</strong> We treat our customers and employees like family</li>
                </ul>
            </section>

        <section class="card full">
            <h3>Get In Touch</h3>
            <p>We'd love to hear from you! Whether you have questions, feedback, or just want to say hello, feel free to reach out.</p>
            <form action="#" method="post">
                <div class="form-field">
                    <label for="contact-name">Name:</label>
                    <input type="text" id="contact-name" name="contact-name" required>
                </div>

                <div class="form-field">
                    <label for="contact-email">Email:</label>
                    <input type="email" id="contact-email" name="contact-email" required>
                </div>

                <div class="form-field">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject">
                </div>

                <div class="form-field">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" cols="50" required></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
